<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 일정표 - 최종</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const IconUsers = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
        const IconUser = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>;
        const IconCalendar = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>;

        const scheduleData = [
            { date: '8/3', day: '월', instructors: ['권봉채', '이봉헌'] },
            { date: '8/4', day: '화', instructors: ['이은주', '이은희'] },
            { date: '8/5', day: '수', instructors: ['공수진', '권봉채'] },
            { date: '8/6', day: '목', instructors: ['신명수', '최정은'] },
            { date: '8/7', day: '금', instructors: ['유경', '이은희'] },
            { date: '8/10', day: '월', instructors: ['이봉헌', '이은희'] },
            { date: '8/11', day: '화', instructors: ['공수진', '권봉채'] },
            { date: '8/12', day: '수', instructors: ['공수진', '신명수'] },
            { date: '8/13', day: '목', instructors: ['이은주', '최정은'] },
            { date: '8/14', day: '금', instructors: ['유경', '최정은'] },
        ];

        const instructors = [
            { name: '공수진', count: 3 },
            { name: '권봉채', count: 3 },
            { name: '신명수', count: 2 },
            { name: '유경', count: 2 },
            { name: '이봉헌', count: 2 },
            { name: '이은주', count: 2 },
            { name: '이은희', count: 3 },
            { name: '최정은', count: 3 },
        ];

        function App() {
            const [selectedInstructor, setSelectedInstructor] = useState(null);

            return (
                <div className="min-h-screen p-4 sm:p-8">
                    <div className="max-w-4xl mx-auto">
                        <header className="mb-8">
                            <h1 className="text-2xl font-bold text-slate-800">한국지역난방공사 강의 일정표</h1>
                            <p className="text-slate-500 text-sm mt-1">최종 확정된 날짜별 상세 일정입니다.</p>
                        </header>

                        <div className="mb-6 flex flex-wrap gap-2">
                            {instructors.map((inst) => (
                                <button
                                    key={inst.name}
                                    onClick={() => setSelectedInstructor(selectedInstructor === inst.name ? null : inst.name)}
                                    className={`px-3 py-1.5 rounded-full text-sm font-medium border ${selectedInstructor === inst.name ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:border-blue-300'}`}
                                >
                                    {inst.name} ({inst.count}회)
                                </button>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                            {scheduleData.map((day, index) => (
                                <div key={index} className={`bg-white rounded-xl shadow-sm border p-4 ${selectedInstructor && !day.instructors.includes(selectedInstructor) ? 'opacity-40' : 'border-slate-200'}`}>
                                    <div className="text-sm font-bold text-blue-600 mb-2 border-b pb-1">{day.date} ({day.day})</div>
                                    <div className="space-y-1">
                                        {day.instructors.map((name, i) => (
                                            <div key={i} className="flex items-center text-xs text-slate-700 bg-slate-50 px-2 py-1 rounded">
                                                <IconUser className="w-3 h-3 mr-1.5 text-slate-400" />
                                                {name}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
