<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한국지역난방공사 강의 일정표</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel (브라우저에서 React 코드 변환) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // 아이콘 SVG 컴포넌트들
        const IconUsers = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
        const IconUser = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>;
        const IconCalendar = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>;
        const IconMapPin = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>;
        const IconClock = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;
        const IconShare = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>;
        const IconInfo = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>;

        function App() {
            const [selectedInstructor, setSelectedInstructor] = useState(null);
            const [showToast, setShowToast] = useState(false);

            // 데이터 업데이트: 이은희(8/4,8/7,8/13,8/14), 이봉헌(8/7 제외, 8/13 원복) 적용
            const scheduleData = [
                { date: '8/3', day: '월', isOff: false, instructors: ['권봉채', '이봉헌'] },
                { date: '8/4', day: '화', isOff: false, instructors: ['권봉채', '이은주', '이은희'] },
                { date: '8/5', day: '수', isOff: false, instructors: ['공수진'] },
                { date: '8/6', day: '목', isOff: false, instructors: ['권봉채', '신명수', '이봉헌', '최정은'] },
                { date: '8/7', day: '금', isOff: false, instructors: ['권봉채', '신명수', '유경', '이은주', '이은희', '최정은'] },
                { date: '8/10', day: '월', isOff: false, instructors: ['이봉헌'] },
                { date: '8/11', day: '화', isOff: true, instructors: [] },
                { date: '8/12', day: '수', isOff: false, instructors: ['공수진', '신명수'] },
                { date: '8/13', day: '목', isOff: false, instructors: ['공수진', '신명수', '이봉헌', '이은주', '이은희', '최정은'] },
                { date: '8/14', day: '금', isOff: false, instructors: ['공수진', '신명수', '유경', '이봉헌', '이은주', '이은희', '진숙희', '최정은'] },
            ];

            // 강사 횟수 업데이트: 이은희 4회, 이봉헌 5회로 재계산
            const instructors = [
                { name: '공수진', count: 4 },
                { name: '권봉채', count: 4 },
                { name: '신명수', count: 5 },
                { name: '유경', count: 2 },
                { name: '이봉헌', count: 5 },
                { name: '이은주', count: 4 },
                { name: '이은희', count: 4 },
                { name: '진숙희', count: 1 },
                { name: '최정은', count: 4 },
            ];

            const toggleInstructor = (name) => {
                if (selectedInstructor === name) setSelectedInstructor(null);
                else setSelectedInstructor(name);
            };

            const handleShare = () => {
                const url = window.location.href;
                const dummy = document.createElement('input');
                document.body.appendChild(dummy);
                dummy.value = url;
                dummy.select();
                document.execCommand('copy');
                document.body.removeChild(dummy);
                
                setShowToast(true);
                setTimeout(() => setShowToast(false), 3000);
            };

            return (
                <div className="min-h-screen pb-12">
                    <header className="bg-gradient-to-r from-blue-700 to-indigo-800 text-white shadow-md">
                        <div className="max-w-4xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-start">
                                <div>
                                    <span className="inline-block px-3 py-1 bg-white/20 text-blue-50 text-xs font-semibold rounded-full mb-3 shadow-sm">
                                        2026년 8월 1~2주차
                                    </span>
                                    <h1 className="text-2xl sm:text-3xl font-bold mb-4">
                                        한국지역난방공사와 두플러스교육
                                    </h1>
                                </div>
                                <button onClick={handleShare} className="p-2 bg-white/10 hover:bg-white/20 rounded-full cursor-pointer" title="링크 복사">
                                    <IconShare className="w-5 h-5" />
                                </button>
                            </div>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                                <div className="flex items-start space-x-3 bg-white/10 p-3 rounded-xl">
                                    <IconMapPin className="w-5 h-5 shrink-0 mt-0.5 text-blue-200" />
                                    <div>
                                        <p className="font-medium text-sm sm:text-base">마포 함께일하는재단 강당</p>
                                        <p className="text-xs text-blue-200 mb-1">월드컵북로6길 36</p>
                                        <a href="https://naver.me/IFwThtkM" target="_blank" className="text-xs font-semibold text-white underline hover:text-blue-200">
                                            네이버 지도로 열기 ↗
                                        </a>
                                    </div>
                                </div>
                                <div className="flex items-center space-x-3 bg-white/10 p-3 rounded-xl">
                                    <IconClock className="w-5 h-5 shrink-0 text-blue-200" />
                                    <div>
                                        <p className="font-medium text-sm sm:text-base">13:30 ~ 17:30</p>
                                        <p className="text-xs text-blue-200">총 4시간 진행</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
                        <section className="mb-8">
                            <div className="flex items-center space-x-2 mb-3">
                                <IconUsers className="w-5 h-5 text-slate-600" />
                                <h2 className="text-lg font-bold text-slate-800">참여 강사 라인업</h2>
                                <span className="text-xs text-slate-500 font-medium bg-slate-200 px-2 py-0.5 rounded-full ml-2">터치하여 필터링</span>
                            </div>
                            
                            <div className="flex flex-wrap gap-2">
                                {instructors.map((inst) => (
                                    <button
                                        key={inst.name}
                                        onClick={() => toggleInstructor(inst.name)}
                                        className={`flex items-center px-4 py-2 rounded-full text-sm font-medium transition-all shadow-sm cursor-pointer border ${
                                            selectedInstructor === inst.name
                                                ? 'bg-blue-600 text-white border-blue-600 ring-2 ring-blue-300 ring-offset-1'
                                                : 'bg-white text-slate-700 border-slate-200 hover:border-blue-300 hover:bg-blue-50'
                                        }`}
                                    >
                                        {inst.name} 
                                        <span className={`ml-2 text-xs px-1.5 py-0.5 rounded-full ${selectedInstructor === inst.name ? 'bg-white/20' : 'bg-slate-100 text-slate-500'}`}>
                                            {inst.count}회
                                        </span>
                                    </button>
                                ))}
                                {selectedInstructor && (
                                    <button onClick={() => setSelectedInstructor(null)} className="px-4 py-2 text-sm font-medium text-slate-500 hover:text-slate-800 underline cursor-pointer">
                                        필터 초기화
                                    </button>
                                )}
                            </div>
                        </section>

                        <section>
                            <div className="flex items-center space-x-2 mb-4">
                                <IconCalendar className="w-5 h-5 text-slate-600" />
                                <h2 className="text-lg font-bold text-slate-800">날짜별 상세 일정</h2>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                                {scheduleData.map((day, index) => {
                                    const isSelectedDay = selectedInstructor ? day.instructors.includes(selectedInstructor) : true;
                                    const opacityClass = (selectedInstructor && !isSelectedDay) ? 'opacity-40 grayscale-[50%]' : 'opacity-100 shadow-md border-blue-100';

                                    if (day.isOff) {
                                        return (
                                            <div key={index} className={`bg-slate-100 border border-slate-200 rounded-2xl p-4 flex flex-col items-center justify-center min-h-[140px] ${opacityClass} transition-all duration-300`}>
                                                <div className="bg-slate-200 text-slate-600 font-bold px-3 py-1 rounded-lg text-sm mb-3">
                                                    {day.date} ({day.day})
                                                </div>
                                                <div className="text-slate-400 font-medium text-sm flex flex-col items-center">
                                                    <IconInfo className="w-5 h-5 mb-1 opacity-50" />
                                                    일정 없음
                                                </div>
                                            </div>
                                        );
                                    }

                                    return (
                                        <div key={index} className={`bg-white border rounded-2xl p-4 flex flex-col transition-all duration-300 ${opacityClass} ${isSelectedDay && selectedInstructor ? 'ring-2 ring-blue-500 ring-offset-2' : ''}`}>
                                            <div className="flex justify-between items-center mb-3 border-b border-slate-100 pb-2">
                                                <span className="font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-lg text-sm">
                                                    {day.date} <span className="text-blue-500 font-semibold">({day.day})</span>
                                                </span>
                                                <span className="text-xs font-medium text-slate-400">{day.instructors.length}명</span>
                                            </div>
                                            
                                            <div className="flex flex-wrap gap-1.5 mt-auto">
                                                {day.instructors.map((name, i) => (
                                                    <div key={i} className={`flex items-center px-2.5 py-1.5 rounded-lg text-sm font-medium border ${selectedInstructor === name ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200'}`}>
                                                        <IconUser className={`w-3.5 h-3.5 mr-1 ${selectedInstructor === name ? 'text-blue-200' : 'text-slate-400'}`} />
                                                        {name}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </section>
                    </main>

                    <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg transition-all duration-300 flex items-center space-x-2 ${showToast ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>
                        <div className="w-2 h-2 bg-green-400 rounded-full"></div>
                        <span className="font-medium text-sm">클립보드에 링크가 복사되었습니다.</span>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
